events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # ── Compression ─────────────────────────────────────────────────────────
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types      application/json application/javascript text/css text/plain
                    image/svg+xml application/xml;

    # ── Rate limiting zones ─────────────────────────────────────────────────
    # Coarse edge-layer limits; the FastAPI app also enforces its own
    # per-route limits (login/register/telemetry) via slowapi — this is a
    # second, cheaper line of defense in front of the app.
    limit_req_zone $binary_remote_addr zone=api_general:10m  rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m     rate=1r/s;

    # Body size cap — relevant once image uploads are wired up; keeps a
    # misbehaving/compromised edge device from sending huge payloads.
    client_max_body_size 8m;

    # ── Upstream FastAPI ────────────────────────────────────────────────────
    upstream api {
        server api:8000;
    }

    # ── Redirect HTTP → HTTPS ───────────────────────────────────────────────
    server {
        listen 80;
        server_name yourdomain.com www.yourdomain.com;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS server ────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name yourdomain.com www.yourdomain.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # ── Baseline security headers ───────────────────────────────────────
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # ── React frontend ──────────────────────────────────────────────────
        root  /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── FastAPI REST ────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_general burst=40 nodelay;

            proxy_pass         http://api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Tighter limit on auth endpoints specifically (login/register brute force).
        location ~ ^/api/v1/auth/(login|register) {
            limit_req zone=api_auth burst=5 nodelay;

            proxy_pass         http://api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── WebSocket  (wss://yourdomain.com/api/v1/ws/...) ────────────────
        location /api/v1/ws/ {
            # FIX: the JWT is passed as a query param (?token=...); avoid
            # writing it into the access log.
            access_log off;

            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 86400s;   # keep WS alive for 24 h
        }

        # ── FastAPI docs ────────────────────────────────────────────────────
        # Disabled in prod at the app level (ENV=production), but keep the
        # proxy route only reachable if the app itself decides to serve it.
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://api;
        }
    }
}